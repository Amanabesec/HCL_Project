<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBot - AI Campus Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="chat-container">
            <header class="chat-header">
                <div class="header-content">
                    <div class="header-avatar"><i class="fas fa-robot"></i></div>
                    <h1>UniBot - AI Campus Assistant 🎓</h1>
                </div>
            </header>
            
            <main class="chat-body" id="chat-body">
                <!-- Messages container -->
            </main>
            
            <div class="typing-indicator-container" id="typing-indicator">
                <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                <div class="typing-bubble">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-btn" aria-label="Send">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="app-footer">Powered by AI • HCL Project</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
